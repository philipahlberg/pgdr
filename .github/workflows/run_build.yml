name: run_build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

defaults:
  run:
    shell: bash -euxo pipefail {0}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: "sccache"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc

        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            archive: .tar.gz

          - target: aarch64-apple-darwin
            runner: macos-26
            archive: .tar.gz

          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            archive: .zip

    runs-on: ${{ matrix.runner }}
    steps:
    - name: Fetch repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      with:
        target: ${{ matrix.target }}

    - name: Install system packages (musl)
      if: contains(matrix.target, 'musl')
      run: sudo apt-get install -y --no-install-recommends clang mold musl-tools

    - name: Fetch cache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Set up mise
      uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      with:
        version: "2025.10.4"

    - name: Build executable
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build archive (linux/darwin)
      if: contains(matrix.target, 'linux') || contains(matrix.target, 'darwin')
      shell: bash
      run: |
        mkdir -p "${{ env.DIST }}"
        cp "${{ env.BIN }}" "${{ env.DIST }}"
        tar czf "${{ env.DIST }}${{ matrix.archive }}" "${{ env.DIST }}"
      env:
        BIN: target/${{ matrix.target }}/release/pgdr
        DIST: pgdr-${{ matrix.target }}-${{ inputs.version }}

    - name: Build archive (windows)
      if: contains(matrix.target, 'windows')
      shell: bash
      run: |
        mkdir -p "${{ env.DIST }}"
        cp "${{ env.BIN }}" "${{ env.DIST }}"
        7z a "${{ env.DIST }}${{ matrix.archive }}" "${{ env.DIST }}"
      env:
        BIN: target/${{ matrix.target }}/release/pgdr
        DIST: pgdr-${{ matrix.target }}-${{ inputs.version }}

    - name: Upload archive
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: "${{ env.DIST }}${{ matrix.archive }}"
        path: "${{ env.DIST }}${{ matrix.archive }}"
        if-no-files-found: error
      env:
        DIST: pgdr-${{ matrix.target }}-${{ inputs.version }}
